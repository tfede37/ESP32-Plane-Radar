; Plane Radar — firmware for two Waveshare round-display boards.
;
;   env:supermini      Waveshare ESP32-S3-Touch-LCD-1.28
;                      1.28" round GC9A01 (240×240) + CST816 touch
;   env:waveshare-28c  Waveshare ESP32-S3-Touch-LCD-2.8C
;                      2.8" round ST7701 (480×480, RGB) + GT911 touch,
;                      TCA9554 I/O expander, 16 MB flash, 8 MB octal PSRAM
;
; Board in Arduino IDE: "ESP32S3 Dev Module". Pinouts live in include/boards/.

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py


; Serial console over the board's CH343 USB-UART bridge (UART0 -> COM port).
; CDC_ON_BOOT=0 keeps Serial on UART0 so `pio device monitor` shows logs.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

[env:waveshare-28c]
; ESP32-S3R8: 16 MB QIO flash + 8 MB octal (OPI) PSRAM. The 480×480 RGB
; framebuffer (450 KB) lives in PSRAM, so the octal memory type is mandatory.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions/plane_radar_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; 480×480 needs a bigger smooth font (Noto Sans Bold 30, scripts/build_vlw_font.py)
board_build.embed_files = data/ui_font_30.vlw
build_flags =
  ${env.build_flags}
  -DBOARD_WAVESHARE_LCD_28C
  -DBOARD_HAS_PSRAM
