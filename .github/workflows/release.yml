# Tag a release (v1.0.0) to attach firmware to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manifest version for a manual (non-tag) run"
        required: false
        default: "dev"

permissions:
  contents: write   # create releases
  pages: write      # deploy the web installer to GitHub Pages
  id-token: write   # Pages deployment auth

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate airport data
        run: python3 scripts/build_large_airports.py

      - name: Build and merge
        run: |
          pio run -e supermini
          pio run -t merge -e supermini
          pio run -e waveshare-28c
          pio run -t merge -e waveshare-28c

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp .pio/build/supermini/firmware-merged.bin "dist/plane-radar-${VERSION}.bin"
          sha256sum "dist/plane-radar-${VERSION}.bin" > "dist/plane-radar-${VERSION}.bin.sha256"
          # 2.8C build (480×480 ST7701 board) ships as a separate image
          cp .pio/build/waveshare-28c/firmware-merged.bin "dist/plane-radar-28c-${VERSION}.bin"
          sha256sum "dist/plane-radar-28c-${VERSION}.bin" > "dist/plane-radar-28c-${VERSION}.bin.sha256"
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Web installer (ESP Web Tools on GitHub Pages) ---
      # Same merged image powers both the release and the browser flasher, so
      # they can't drift. ESP Web Tools allows one build per chip family, so the
      # installer serves the 1.28" image; 2.8C users grab the release asset.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble web-installer site
        run: |
          mkdir -p site
          cp docs/index.html site/index.html
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then version="${{ github.event.inputs.version }}"; fi
          sed "s/\"version\": *\"[^\"]*\"/\"version\": \"${version}\"/" docs/manifest.json > site/manifest.json
          cp .pio/build/supermini/firmware-merged.bin site/firmware-merged.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
